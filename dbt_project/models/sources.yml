version: 2

sources:

  - name: crm_source
    description: "CRM platform for managing customers, sales pipeline and sales team"
    tables:
      - name: Customer
        description: "A customer account in the CRM"
        columns:
          - name: CustomerId
            description: "Unique customer identifier"
          - name: CompanyName
            description: "Company or organization name"
          - name: ContactName
            description: "Primary contact person"
          - name: Email
            description: "Primary email address"
          - name: Phone
            description: "Primary phone number"
          - name: Industry
            description: "Industry vertical"
          - name: CreatedDate
            description: "Date the customer was created in the CRM"

      - name: Opportunity
        description: "A potential sales deal for licenses or consultancy services"
        columns:
          - name: OpportunityId
            description: "Unique opportunity identifier"
          - name: CustomerId
            description: "FK to Customer"
          - name: SalesPersonId
            description: "FK to the SalesPerson owning this deal"
          - name: OpportunityName
            description: "Short description of the deal"
          - name: Stage
            description: "Pipeline stage"
          - name: Amount
            description: "Estimated deal value"
          - name: CloseDate
            description: "Expected or actual close date"
          - name: CreatedDate
            description: "Date the opportunity was created"

      - name: SalesPerson
        description: "A sales representative managing customer relationships and deals"
        columns:
          - name: SalesPersonId
            description: "Unique sales person identifier"
          - name: FirstName
            description: "First name"
          - name: LastName
            description: "Last name"
          - name: Email
            description: "Work email address"
          - name: Region
            description: "Sales territory or region"
          - name: HireDate
            description: "Date the sales person joined the company"

  - name: erp_source
    description: "ERP platform covering sales orders, products and invoicing"
    tables:
      - name: Invoice
        description: "A billing document issued for a sales order"
        columns:
          - name: InvoiceId
            description: "Unique invoice identifier"
          - name: SalesOrderId
            description: "FK to Sales Order"
          - name: InvoiceDate
            description: "Date the invoice was issued"
          - name: DueDate
            description: "Payment due date"
          - name: TotalAmount
            description: "Total invoice amount"
          - name: Status
            description: "Invoice status (Draft, Sent, Paid, Overdue, Cancelled)"

      - name: SalesOrder
        description: "A sales order placed by a customer"
        columns:
          - name: SalesOrderId
            description: "Unique sales order identifier"
          - name: CustomerNumber
            description: "Customer reference (external key to CRM)"
          - name: OrderDate
            description: "Date the order was placed"
          - name: Status
            description: "Order status"
          - name: TotalAmount
            description: "Total order amount"
          - name: Currency
            description: "Currency code (ISO 4217)"
