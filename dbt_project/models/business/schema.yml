version: 2

models:

  - name: customer
    description: >
      A customer account with their key identifiers and contact details.
      Built from the CRM Customer table with SalesPersonId resolved via Opportunity.
    columns:
      - name: CustomerId
        description: "Unique customer identifier"
        tests:
          - not_null
          - unique
      - name: CompanyName
        description: "Company or organisation name"
      - name: ContactName
        description: "Primary contact person"
      - name: Email
        description: "Primary email address"
      - name: Industry
        description: "Industry vertical"
      - name: SalesPersonId
        description: "FK to the Sales Person managing this customer"

  - name: salesperson
    description: >
      A sales representative responsible for managing customer accounts and
      driving revenue. FullName is derived by concatenating FirstName and LastName
      from the CRM SalesPerson table.
    columns:
      - name: SalesPersonId
        description: "Unique sales person identifier"
        tests:
          - not_null
          - unique
      - name: FullName
        description: "Full name of the sales person (FirstName + LastName)"
      - name: Email
        description: "Work email address"
      - name: Region
        description: "Sales territory or region"

  - name: invoice
    description: >
      A billing document issued to a customer, capturing amount and payment status.
      Joins ERP Invoice and SalesOrder to resolve the customer reference, and the
      CRM Opportunity to resolve the associated SalesPerson.
    columns:
      - name: InvoiceId
        description: "Unique invoice identifier"
        tests:
          - not_null
          - unique
      - name: CustomerId
        description: "FK to the Customer this invoice belongs to"
        tests:
          - not_null
      - name: SalesPersonId
        description: "FK to the Sales Person associated with this invoice"
      - name: InvoiceDate
        description: "Date the invoice was issued"
        tests:
          - not_null
      - name: DueDate
        description: "Payment due date"
      - name: TotalAmount
        description: "Total invoice amount"
      - name: Currency
        description: "Currency code (ISO 4217)"
      - name: Status
        description: "Invoice payment status (Draft, Sent, Paid, Overdue, Cancelled)"

  - name: revenue_per_customer
    description: >
      Aggregated revenue view per customer, showing total invoiced, paid and
      outstanding amounts alongside the managing sales person.
      References the business layer models: customer, salesperson, and invoice.
    columns:
      - name: CustomerId
        description: "Unique customer identifier"
        tests:
          - not_null
          - unique
      - name: CompanyName
        description: "Customer company name"
      - name: Industry
        description: "Industry vertical of the customer"
      - name: SalesPersonId
        description: "FK to the Sales Person managing this customer"
      - name: SalesPersonName
        description: "Full name of the managing sales person"
      - name: SalesRegion
        description: "Sales region of the managing sales person"
      - name: TotalInvoiced
        description: "Sum of all invoice amounts for this customer"
      - name: TotalPaid
        description: "Sum of all paid invoice amounts"
      - name: TotalOutstanding
        description: "Sum of all unpaid (Sent + Overdue) invoice amounts"
      - name: InvoiceCount
        description: "Total number of invoices for this customer"
      - name: OverdueCount
        description: "Number of overdue invoices"
